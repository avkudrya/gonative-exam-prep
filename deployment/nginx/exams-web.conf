# /etc/nginx/conf.d/exams.mnemonicwords.app.conf — installed by deployment/activate-web.sh.
# One Next app (exams-web.service, 127.0.0.1:3300) serves both hosts; it tells them apart by Host (ADR-001).
# One certificate for both names: certbot --cert-name exams.mnemonicwords.app (deployment/setup-server.sh).
server {
    listen 443 ssl;
    server_name exams.mnemonicwords.app ielts.mnemonicwords.app;
    ssl_certificate /etc/letsencrypt/live/exams.mnemonicwords.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exams.mnemonicwords.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Closed to indexing until the owner opens launch indexing; the app sends the same header.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # The largest BFF body is an essay draft (200 KB, enforced again by the BFF).
    client_max_body_size 256k;
    # Pre-launch password gate, when installed (nginx/gonative-preview-auth.conf; no file, no gate).
    include /etc/nginx/gonative-preview-auth*.conf;
    # Build identity only; stays reachable for monitoring behind the gate.
    location = /api/health {
        allow all;
        auth_basic off;
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
server {
    listen 80;
    server_name exams.mnemonicwords.app ielts.mnemonicwords.app;
    return 301 https://$host$request_uri;
}
