# Pre-launch password gate for GoNative sites (owner decision 2026-11-24). Installed by the owner as
#   /etc/nginx/gonative-preview-auth.conf   — NOT in conf.d/, which nginx includes at http level for every site.
# Sites pull it in with `include /etc/nginx/gonative-preview-auth*.conf;` (a glob: no file, no gate).
# To open the sites at launch: remove that file, `nginx -t`, reload.
satisfy any;
# The server itself passes without a password: deploy checks (wait-web.sh) call the public URL from here.
allow 127.0.0.1;
allow 72.62.178.66;
deny all;
auth_basic "GoNative preview";
auth_basic_user_file /etc/nginx/gonative-preview.htpasswd;
