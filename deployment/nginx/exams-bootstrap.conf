# /etc/nginx/conf.d/exams.mnemonicwords.app.conf before the first deployment — installed by
# deployment/setup-server.sh so that certbot can confirm both names over HTTP. Replaced by
# exams-web.conf on the first `deploy.sh <commit> --activate`.
server {
    listen 80;
    server_name exams.mnemonicwords.app ielts.mnemonicwords.app;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / {
        default_type text/plain;
        return 503 "GoNative Exams: coming soon\n";
    }
}
